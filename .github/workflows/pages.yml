# Builds the app and publishes dist/ to GitHub Pages.
#
# Pages must be set to deploy from GitHub Actions for this to take effect:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Serving the repository root instead publishes the dev index.html, whose
# script tag points at /src/main.tsx — which does not exist in a build, so the
# page loads blank.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/yard-systems-simulator-wyh9l9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test the engine
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
