# Checks the WordPress theme and plugin on every push that touches them, and
# deploys them to the staging site over SSH.
#
# Staging is the test site, so any branch may deploy to it. When the real
# domain goes live, give it its own PRODUCTION_* secrets and deploy it from
# `main` only, the way pages.yml does for the simulator.
#
# Secrets (Settings → Secrets and variables → Actions):
#   STAGING_SSH_HOST       required; without it the deploy is skipped
#   STAGING_SSH_USER       required
#   STAGING_SSH_PASSWORD   required
#   STAGING_SSH_PORT       optional, default 22
#   STAGING_WP_PATH        optional; found by looking for wp-config.php if unset
name: WordPress site

on:
  push:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress.yml'
  workflow_dispatch:
    inputs:
      starter:
        description: 'Also add any missing starter content (never overwrites)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wordpress-staging
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JSON
        run: find wordpress -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool --no-ensure-ascii > /dev/null

      - name: Package
        run: wordpress/bin/build-zips.sh "$RUNNER_TEMP/zips"

      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-zips
          path: ${{ runner.temp }}/zips/*.zip

  deploy-staging:
    needs: check
    runs-on: ubuntu-latest
    environment: wordpress-staging
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      USER_NAME: ${{ secrets.STAGING_SSH_USER }}
      SSHPASS: ${{ secrets.STAGING_SSH_PASSWORD }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      WP_PATH: ${{ secrets.STAGING_WP_PATH }}
      STARTER: ${{ inputs.starter }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_NAME" ] || [ -z "$SSHPASS" ]; then
            echo "::warning::Staging SSH secrets are not set, so nothing was deployed."
            exit 0
          fi
          sudo apt-get install -y -qq sshpass > /dev/null

          # A fresh runner has never seen the host, so its key is accepted on
          # first contact. Fine for a test site; pin it before production.
          remote() {
            sshpass -e ssh -p "${PORT:-22}" -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$USER_NAME@$HOST" "$@"
          }

          if [ -z "$WP_PATH" ]; then
            WP_PATH=$(remote 'f=$(find ~ /var/web -maxdepth 4 -name wp-config.php 2>/dev/null | head -1); [ -n "$f" ] && dirname "$f"')
          fi
          if [ -z "$WP_PATH" ]; then
            echo "::error::Could not find wp-config.php on the server. Set STAGING_WP_PATH."
            exit 1
          fi
          echo "WordPress root: $WP_PATH"

          # Unpack beside the live copy and swap, so a half-finished upload is
          # never what the site is running.
          ship() {
            local src_dir="$1" name="$2" dest="$3"
            tar -C "$src_dir" -czf - "$name" | remote "set -e
              mkdir -p '$dest'
              rm -rf '$dest/.$name.new' '$dest/.$name.old'
              mkdir '$dest/.$name.new'
              tar -xzf - -C '$dest/.$name.new'
              [ -d '$dest/$name' ] && mv '$dest/$name' '$dest/.$name.old'
              mv '$dest/.$name.new/$name' '$dest/$name'
              rm -rf '$dest/.$name.new' '$dest/.$name.old'"
            echo "Deployed $name"
          }
          ship wordpress/plugin yard-systems "$WP_PATH/wp-content/plugins"
          ship wordpress/theme working-yard "$WP_PATH/wp-content/themes"

          # First deploy only: switch them on and lay down the starter content.
          # After that a deploy changes files and nothing else, so a theme or
          # setting changed in the dashboard is never switched back.
          remote "cd '$WP_PATH' && set -e
            admin=\$(wp user list --role=administrator --field=ID | head -1)
            if ! wp plugin is-active yard-systems; then
              wp plugin activate yard-systems
              wp theme activate working-yard
              wp yard-starter --user=\$admin
            elif [ '$STARTER' = 'true' ]; then
              wp yard-starter --user=\$admin
            fi
            wp rewrite flush
            wp cache flush || true"
