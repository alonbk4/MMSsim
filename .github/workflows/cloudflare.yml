# Builds the app and publishes dist/ to Cloudflare Pages, as the project
# `mmssim` (mmssim.pages.dev).
#
# The site sits behind Cloudflare Access: only the emails in the "Invited
# people" policy (Zero Trust → Access controls → Policies) can open it, and
# the gate covers the preview addresses too. Only `main` is published, as the
# production deployment, so no preview addresses are made.
#
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an account token with Cloudflare Pages: Edit, and
#                          nothing else; without it the deploy is skipped
#   CLOUDFLARE_ACCOUNT_ID  the account the project is in
name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test the engine
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set, so nothing was deployed."
            exit 0
          fi
          npx --yes wrangler@4.149.0 pages deploy dist \
            --project-name=mmssim --branch=main --commit-hash="$GITHUB_SHA"
