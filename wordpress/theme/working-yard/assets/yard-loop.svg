<svg class="wy-loop" viewBox="-14 0 708 590" role="img" aria-labelledby="wy-loop-t wy-loop-d" xmlns="http://www.w3.org/2000/svg">
<title id="wy-loop-t">How the yard’s systems feed each other</title>
<desc id="wy-loop-d">Kitchen scraps go to the hot composter, and its compost goes to the beds. Cleared buckthorn becomes biochar, which is charged and goes into the composter. Water from the aquaponics tank charges the biochar and makes worm tea for the beds. The nettle patch makes liquid feed for the beds. The beds feed the kitchen.</desc>
